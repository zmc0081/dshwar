<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DSHWAR 工作台</title>
  </head>
  <body>
    <div id="root"></div>
    <!--
      ⚠️ 运行期配置。**宿主注入,不编译进产物。**

      这一段在真实部署里由服务端模板渲染、或由 Tauri 壳在加载前写入。
      开发时用下面这份占位值,指向本地网关。

      为什么不放 .env:.env 会在构建时被内联进 bundle,而那就等于
      「一个二进制服务所有租户」这条不成立了 —— token 与 baseUrl 都是
      每个部署各不相同的东西。
    -->
    <script>
      window.__DSHWAR_CONFIG__ = {
        // ⚠️ 注入的是「我是谁」,不是「你去连哪」。baseUrl 由 hostKind
        //    (Tauri 另加 gatewayPort)在 src/hosts.ts 里算出来 ——
        //    那里有「三宿主除 baseUrl 外逐字段相同」的断言,而三份部署配置各自
        //    手写 baseUrl 时,它们分家的过程没有任何一步会红。
        //
        // 开发期是远端 Web 那一档:vite 把 /v1 代理到本地网关,浏览器看到的是同源。
        hostKind: 'remote-web',
        token: 'dev-alice',
        productName: 'DSHWAR',
        legalEntityName: '',
        // null = 未配置 = 中性外观。**不要在这里填一个色**:填了就等于
        // 开发期看到的永远是某个租户的品牌,而中性那条路没人走过。
        primaryColor: null,
        theme: 'light',
      }
    </script>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
