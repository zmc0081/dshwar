name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 守卫先跑、单独成 job:边界与锁版违规不该等 20 分钟的矩阵跑完才报出来,
  # 而且它们与 Node 版本无关,跑两遍是浪费。
  guards:
    name: 纪律守卫
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 版本号一致性(CLAUDE.md 第四节)
        run: pnpm check:version

      - name: PR 自查清单(CLAUDE.md 第二节)
        run: pnpm check:guards

      - name: 开源纯净度(硬规则 9 —— SignPath 资格条件)
        run: pnpm check:oss

      - name: 守卫的负向测试 —— 确认守卫真的会拦
        run: pnpm verify:guards

      - name: Prettier
        run: pnpm format:check

  # 契约冻结单独成 job,因为它是唯一需要**历史**的检查:
  # 基线是上一次提交里的那份 OpenAPI,而其它 job 用浅克隆就够了。
  contract:
    name: 契约冻结
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 浅克隆取不到基线,check-contract 会「跳过」而不是「通过」——
          # 那正是这道检查最不该发生的事。
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 与目标分支比对 OpenAPI
        env:
          # PR 比目标分支;push 比上一个提交。
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.event.pull_request.base.ref) || 'HEAD~1' }}
        run: node --experimental-strip-types scripts/check-contract.mjs --base "$BASE_REF"

  build:
    name: 构建与测试 (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 与上游 engines 一致:^22.19.0 || >=24.0.0
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # 测试文件走独立的解决方案文件(各包的 tsconfig.json 把它们 exclude 掉了)。
      # 不单独跑这一步,测试里的类型错误在所有门禁上都不会红。
      - name: Typecheck(测试文件)
        run: pnpm typecheck:test

      - name: Lint(含 adapters 边界规则)
        run: pnpm lint

      - name: 单元测试
        run: pnpm test

      - name: 上游契约测试
        run: pnpm test:contract

  # PTY 相关契约测试只能在 Linux 跑:上游 dsh-subprocess-local 的 ProcessInspector
  # 只实现了 linux 与 darwin,win32 直接抛错。
  # 见 docs/FEASIBILITY-REPORT.md 验证 D。
  #
  # 本 job 现在是空跑占位,Session 7 落地契约测试后启用真实断言。
  terminal-contract:
    name: 终端能力契约(仅 Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 占位 —— Session 7 在此接入 PTY 契约测试
        run: echo "PTY contract tests land in Session 7 (R8)."
