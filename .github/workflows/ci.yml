name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# CI 只读代码,不写任何东西。显式钉死而不是靠仓库设置的默认值:
# 那个默认值**不在版本控制里**,改动无痕、不经 review,而且组织级策略
# 也可能把它调宽。发布相关的写权限将来由 release.yml 单独申请。
permissions:
  contents: read

# ════════════════════════════════════════════════════════════════════════
# ⚠️ 本文件**不得枚举任何一条门禁**。
#
# 门禁的唯一清单是 `package.json` 的 `check:all`。这里只调那一个入口。
#
# 起因:首次真实 runner 复盘发现,本地 `check:all` 与 CI 跑的不是同一组 ——
# 两边各有对方没有的项,于是「本地全绿」从来就不代表 CI 会绿。当时的修法是
# 把两边对齐,并写下「改门禁要同时改两处」的规矩。
#
# **但这个项目已经反复证明,靠人记住的事会被忘,而且忘的那次是静默的**
# (忘登记 principal 消费方、忘给新包加 test tsconfig、忘同步本文件)。
# 每次的解法都是加守卫,这次也不例外 —— 只是这次能做得更彻底:
# 与其守住「两个清单相等」,不如**只留一个清单**,漂移在结构上不存在。
#
# 这条不变式由 `scripts/check-guards.mjs` 的「CI 不得枚举门禁」守住,
# 负向验证在 `scripts/verify-guards.mjs`。
# ════════════════════════════════════════════════════════════════════════

jobs:
  gate:
    name: 门禁 (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    # stripe-mock:billing-stripe 的集成测试打它(D5 —— 官方模拟器,无账号无 key)。
    # 这不是「第二份门禁清单」:清单仍只有 check:all,这里只是给它备好环境。
    # 测试侧探测 localhost:12111,探不到才 skip —— 而 service 起不来时
    # GitHub Actions 会直接 fail 整个 job,所以「CI 里静默 skip」不存在。
    services:
      stripe-mock:
        image: stripe/stripe-mock:latest
        ports:
          - 12111:12111
    strategy:
      fail-fast: false
      matrix:
        # 与上游 engines 一致:^22.19.0 || >=24.0.0
        #
        # 矩阵直接架在 check:all 上,而不是另起一个「只跑测试」的 job ——
        # 后者会把 typecheck / test / lint 的名字重新写进本文件,枚举就回来了。
        # 代价是版本无关的检查(版本号一致性、Prettier、开源纯净度)跑两遍,
        # 多花约一分钟。**用一分钟换掉一整类静默漂移,这个价很便宜。**
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          # 契约冻结要读**上一个提交**里的 openapi.json 当基线。
          # 浅克隆取不到,check-contract 会「跳过」而不是「通过」——
          # 那正是这道检查最不该发生的事。
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # ★ 唯一的门禁入口。要加检查请改 package.json 的 check:all,不要改这里。
      #   契约冻结的基线选择(PR 比目标分支 / push 比上一提交)已经收进
      #   scripts/check-contract.mjs,不需要在这里算 --base。
      - name: pnpm check:all
        run: pnpm check:all

  # ── 以下是 CI 独有的东西,不属于 check:all ────────────────────────────
  #
  # 判据:**在开发机上跑没有意义**的才放这里。
  # 性能基线依赖固定的机器规格,PTY 依赖 Linux —— 两者放进 check:all
  # 会让贡献者在自己机器上随机变红,而那种红没有信息量。

  # 进程隔离的代价 —— 常驻测量 + 上界门禁。
  #
  # 为什么值得一个 job:README 的规模对照表、maxProcesses 的推导、
  # DEPLOYMENT.md 的容量规划,全部由这两个数推出,而采用者照着它们买服务器。
  # 一次让内存翻倍的改动会让这几处同时变成谎话,**且不会让任何测试变红** ——
  # 内存不在断言里。
  #
  # 阈值的定法见 docs/DECISIONS/process-cost-thresholds.md。
  # 放宽它之前先读那份文档:阈值放宽一次,这道门禁就再也抓不到下一次翻倍。
  process-cost:
    name: 进程隔离代价(Linux 基线)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # 固定 Node 22 而不是跟矩阵:这道门禁比的是**跨提交**的趋势,
          # 换 Node 版本会让数字跳一档,那种红说明不了任何事。
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 构建
        run: pnpm build

      # 阈值由 2026-08-16 的 Linux 实测(86 ms / 63 MB)× 系数推出,不是猜的 ——
      # 首次接入时刻意先跑了一版不带 `--assert` 的,拿到数之后才打开判定。
      - name: 五次采样,与 V0.4.5 的 Windows 口径对齐
        run: node scripts/measure-process-cost.mjs --assert

  # PTY 相关契约测试只能在 Linux 跑:上游 dsh-subprocess-local 的 ProcessInspector
  # 只实现了 linux 与 darwin,win32 直接抛错。
  # 见 docs/FEASIBILITY-REPORT.md 验证 D。
  #
  # 本 job 现在是空跑占位,Session 7 落地契约测试后启用真实断言。
  terminal-contract:
    name: 终端能力契约(仅 Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 占位 —— Session 7 在此接入 PTY 契约测试
        run: echo "PTY contract tests land in Session 7 (R8)."
