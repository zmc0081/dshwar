name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# CI 只读代码,不写任何东西。显式钉死而不是靠仓库设置的默认值:
# 那个默认值**不在版本控制里**,改动无痕、不经 review,而且组织级策略
# 也可能把它调宽。发布相关的写权限将来由 release.yml 单独申请。
permissions:
  contents: read

jobs:
  # 守卫先跑、单独成 job:边界与锁版违规不该等 20 分钟的矩阵跑完才报出来,
  # 而且它们与 Node 版本无关,跑两遍是浪费。
  guards:
    name: 纪律守卫
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 版本号一致性(CLAUDE.md 第四节)
        run: pnpm check:version

      - name: PR 自查清单(CLAUDE.md 第二节)
        run: pnpm check:guards

      - name: 开源纯净度(硬规则 9 —— SignPath 资格条件)
        run: pnpm check:oss

      - name: 守卫的负向测试 —— 确认守卫真的会拦
        run: pnpm verify:guards

      - name: Prettier
        run: pnpm format:check

  # 契约冻结单独成 job,因为它是唯一需要**历史**的检查:
  # 基线是上一次提交里的那份 OpenAPI,而其它 job 用浅克隆就够了。
  contract:
    name: 契约冻结
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 浅克隆取不到基线,check-contract 会「跳过」而不是「通过」——
          # 那正是这道检查最不该发生的事。
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 与目标分支比对 OpenAPI
        env:
          # PR 比目标分支;push 比上一个提交。
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.event.pull_request.base.ref) || 'HEAD~1' }}
        run: node --experimental-strip-types scripts/check-contract.mjs --base "$BASE_REF"

  build:
    name: 构建与测试 (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 与上游 engines 一致:^22.19.0 || >=24.0.0
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # 测试文件走独立的解决方案文件(各包的 tsconfig.json 把它们 exclude 掉了)。
      # 不单独跑这一步,测试里的类型错误在所有门禁上都不会红。
      - name: Typecheck(测试文件)
        run: pnpm typecheck:test

      # scripts/ 下的 .mjs 走 tsconfig.scripts.json(allowJs + checkJs)。
      # 首次 CI 复盘发现这一条从 V0.4.6 加进 check:all 起就没进过 workflow ——
      # 于是 CI 一直比本地弱一条,而弱的那条恰恰盯着门禁脚本自己。
      - name: Typecheck(scripts/)
        run: pnpm typecheck:scripts

      - name: Lint(含 adapters 边界规则)
        run: pnpm lint

      - name: 单元测试
        run: pnpm test

      - name: 上游契约测试
        run: pnpm test:contract

  # 断言有效性探针 —— V0.4.6 的核心产出,首次 CI 复盘时发现它从没进过 workflow。
  #
  # 单独成 job 而不是塞进 build:它要跑 8 次 vitest(每次篡改一处源码再还原),
  # 比整套单测还慢,挂在矩阵里等于把两个 Node 版本各拖一遍。
  #
  # ⚠️ 它**会临时改写工作区里的源文件**,`finally` 还原。在 CI 上是一次性检出,
  # 没有副作用;本地跑之前请确认没有未提交的改动。
  assertions:
    name: 断言有效性探针
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # 必须先构建:网关的测试经 dist 解析 @dshwar/*,不构建就是在测上一次的产物。
      - name: 构建
        run: pnpm build

      - name: 故意弄坏实现,确认对应的测试真的变红
        run: pnpm verify:assertions

  # 进程隔离的代价 —— 常驻测量 + 上界门禁。
  #
  # 为什么它值得一个 job:README 的规模对照表、maxProcesses 的默认值、
  # DEPLOYMENT.md 的容量规划,三处**全部**由这两个数推出,而采用者照着它们
  # 买服务器。一次让内存翻倍的改动会让这三处同时变成谎话,
  # **且不会让任何测试变红** —— 内存不在断言里。
  #
  # 阈值的定法见 docs/DECISIONS/process-cost-thresholds.md。
  # 放宽它之前先读那份文档:阈值放宽一次,这道门禁就再也抓不到下一次翻倍。
  process-cost:
    name: 进程隔离代价(Linux 基线)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # 固定 Node 22 而不是跟矩阵:这道门禁比的是**跨提交**的趋势,
          # 换 Node 版本会让数字跳一档,那种红说明不了任何事。
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 构建
        run: pnpm build

      # 阈值由 2026-08-16 的 Linux 实测(86 ms / 63 MB)× 系数推出,不是猜的 ——
      # 首次接入时刻意先跑了一版不带 `--assert` 的,拿到数之后才打开判定。
      # 定法见 docs/DECISIONS/process-cost-thresholds.md。
      - name: 五次采样,与 V0.4.5 的 Windows 口径对齐
        run: node scripts/measure-process-cost.mjs --assert

  # PTY 相关契约测试只能在 Linux 跑:上游 dsh-subprocess-local 的 ProcessInspector
  # 只实现了 linux 与 darwin,win32 直接抛错。
  # 见 docs/FEASIBILITY-REPORT.md 验证 D。
  #
  # 本 job 现在是空跑占位,Session 7 落地契约测试后启用真实断言。
  terminal-contract:
    name: 终端能力契约(仅 Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 占位 —— Session 7 在此接入 PTY 契约测试
        run: echo "PTY contract tests land in Session 7 (R8)."
