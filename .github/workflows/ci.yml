name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# CI 只读代码,不写任何东西。显式钉死而不是靠仓库设置的默认值:
# 那个默认值**不在版本控制里**,改动无痕、不经 review,而且组织级策略
# 也可能把它调宽。发布相关的写权限将来由 release.yml 单独申请。
permissions:
  contents: read

# ════════════════════════════════════════════════════════════════════════
# ⚠️ 本文件**不得枚举任何一条门禁**。
#
# 门禁的唯一清单是 `package.json` 的 `check:all`。这里只调那一个入口。
#
# 起因:首次真实 runner 复盘发现,本地 `check:all` 与 CI 跑的不是同一组 ——
# 两边各有对方没有的项,于是「本地全绿」从来就不代表 CI 会绿。当时的修法是
# 把两边对齐,并写下「改门禁要同时改两处」的规矩。
#
# **但这个项目已经反复证明,靠人记住的事会被忘,而且忘的那次是静默的**
# (忘登记 principal 消费方、忘给新包加 test tsconfig、忘同步本文件)。
# 每次的解法都是加守卫,这次也不例外 —— 只是这次能做得更彻底:
# 与其守住「两个清单相等」,不如**只留一个清单**,漂移在结构上不存在。
#
# 这条不变式由 `scripts/check-guards.mjs` 的「CI 不得枚举门禁」守住,
# 负向验证在 `scripts/verify-guards.mjs`。
# ════════════════════════════════════════════════════════════════════════

jobs:
  gate:
    name: 门禁 (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    # stripe-mock:billing-stripe 的集成测试打它(D5 —— 官方模拟器,无账号无 key)。
    # 这不是「第二份门禁清单」:清单仍只有 check:all,这里只是给它备好环境。
    # 测试侧探测 localhost:12111,探不到才 skip —— 而 service 起不来时
    # GitHub Actions 会直接 fail 整个 job,所以「CI 里静默 skip」不存在。
    services:
      stripe-mock:
        image: stripe/stripe-mock:latest
        ports:
          - 12111:12111
    strategy:
      fail-fast: false
      matrix:
        # 与上游 engines 一致:^22.19.0 || >=24.0.0
        #
        # 矩阵直接架在 check:all 上,而不是另起一个「只跑测试」的 job ——
        # 后者会把 typecheck / test / lint 的名字重新写进本文件,枚举就回来了。
        # 代价是版本无关的检查(版本号一致性、Prettier、开源纯净度)跑两遍,
        # 多花约一分钟。**用一分钟换掉一整类静默漂移,这个价很便宜。**
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          # 契约冻结要读**上一个提交**里的 openapi.json 当基线。
          # 浅克隆取不到,check-contract 会「跳过」而不是「通过」——
          # 那正是这道检查最不该发生的事。
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # ★ 唯一的门禁入口。要加检查请改 package.json 的 check:all,不要改这里。
      #   契约冻结的基线选择(PR 比目标分支 / push 比上一提交)已经收进
      #   scripts/check-contract.mjs,不需要在这里算 --base。
      # ⚠️ 失败时把**关键行**喂进 annotation(scripts/ci-annotate.mjs)。
      #
      #   理由不是调试方便:job 的完整日志**只有对仓库有 admin 权限的人下得到**
      #   (API 对其余人返回 403),而 annotation 是公开可读的。
      #   于是「CI 为什么红」对提 PR 的外部贡献者、对手机上看面板的人,
      #   都从「看不到」变成「看得到一段」。
      #
      #   这不是第二份门禁清单:跑的仍然只有 `check:all` 一条命令,
      #   外面那层只做「把失败复述一遍」。
      #
      #   ⚠️ 这里曾经是一行 `tail -n 40 | tr | cut -c1-1500`,它的**第一次真实运行**
      #   就同时露了三个静默的洞(`tail` 取末尾而 `cut -c1-N` 取开头,两个方向相反的
      #   截断串起来把根因切掉了)。细节与负向验证见那个脚本的头注释。
      #
      #   日志落在 `$RUNNER_TEMP` 而不是 `/tmp`:后者在 Windows runner 的 bash 里
      #   是个 MSYS 虚路径,Node 拿到会去找 `C:\tmp`。
      - name: pnpm check:all
        run: |
          set -o pipefail
          pnpm check:all 2>&1 | tee "$RUNNER_TEMP/gate.log" || {
            node scripts/ci-annotate.mjs "$RUNNER_TEMP/gate.log" "check:all 失败"
            exit 1
          }

  # ── 以下是 CI 独有的东西,不属于 check:all ────────────────────────────
  #
  # 判据:**在开发机上跑没有意义**的才放这里。
  # 性能基线依赖固定的机器规格,PTY 依赖 Linux —— 两者放进 check:all
  # 会让贡献者在自己机器上随机变红,而那种红没有信息量。

  # 进程隔离的代价 —— 常驻测量 + 上界门禁。
  #
  # 为什么值得一个 job:README 的规模对照表、maxProcesses 的推导、
  # DEPLOYMENT.md 的容量规划,全部由这两个数推出,而采用者照着它们买服务器。
  # 一次让内存翻倍的改动会让这几处同时变成谎话,**且不会让任何测试变红** ——
  # 内存不在断言里。
  #
  # 阈值的定法见 docs/DECISIONS/process-cost-thresholds.md。
  # 放宽它之前先读那份文档:阈值放宽一次,这道门禁就再也抓不到下一次翻倍。
  process-cost:
    name: 进程隔离代价(Linux 基线)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # 固定 Node 22 而不是跟矩阵:这道门禁比的是**跨提交**的趋势,
          # 换 Node 版本会让数字跳一档,那种红说明不了任何事。
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 构建
        run: pnpm build

      # 阈值由 2026-08-16 的 Linux 实测(86 ms / 63 MB)× 系数推出,不是猜的 ——
      # 首次接入时刻意先跑了一版不带 `--assert` 的,拿到数之后才打开判定。
      #
      # ★ `--require-threshold`:CI 明确跑在 ubuntu-latest 上,那里**必须**有
      #   阈值条目。没有这个参数,`linux` 键一旦被改名或删掉,脚本会走
      #   「跳过判定」分支安静退出 0 —— 门禁退化成恒绿而面板照样是绿勾。
      #   这个洞是 2026-08-17 扫「还有没有第二个恒绿的检查」时找出来的。
      - name: 五次采样,与 V0.4.5 的 Windows 口径对齐
        run: node scripts/measure-process-cost.mjs --assert --require-threshold

  # 桌面壳:Rust 断言 + 真的打一次包(V0.9.0 Session 6)。
  #
  # 为什么值一个 job:Session 5 交付 `src-tauri` 时,**CI 里一个 rust / cargo /
  # tauri 字样都没有** —— 那 15 条断言(含一条真读写系统钥匙串的 round-trip)
  # 只在开发机上跑过。`pnpm test:shell` 当时会「吵着跳过」,而吵闹只对
  # 看输出的人有效,对**从不看输出的绿勾**无效。
  #
  # 打包本身也必须在 CI 上跑:打包链路的失败几乎全是**环境差异**
  # (少一个系统库、少一个 target、Node 版本不对),而那种失败在开发机上
  # 永远不出现。只在本地打过包 = 只证明了这台机器能打包。
  desktop-shell:
    name: 桌面壳(${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macOS 刻意不在列:它要 Apple Developer($99/年)才能签名,
        # 而**没签名的 .dmg 装不上**(Gatekeeper 直接拦)。跑一个装不上的产物
        # 只是把 CI 时间花掉。签名进来的那一天再加 macos-latest。
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # ⚠️ **钉死 22**,不跟矩阵:这个版本会被**拷进安装包**当 sidecar 运行时
          # (scripts/pack-sidecar.mjs 拷的就是跑它的那个 node)。
          # 跟矩阵的话,同一次 CI 会产出两个带不同运行时的包,
          # 而「用户装到的是哪一个」取决于哪个 job 先传完产物。
          node-version: 22
          cache: pnpm

      # Tauri 在 Linux 上要 WebKitGTK。少了它,报的是一堆 pkg-config 找不到,
      # 与「代码写错了」长得完全不一样 —— 所以显式装,不靠镜像里碰巧有。
      - name: Linux 系统依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf gnome-keyring dbus-x11

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      # 🚨 **打包的前两步必须排在 `cargo test` 之前** —— 这不是优化,是硬依赖。
      #
      # `cargo test` 会编 bin 目标,而 bin 的 `build.rs` 跑 `tauri_build::build()`,
      # 它**校验配置里承诺的东西真的在**:`frontendDist` 指的目录、
      # `externalBin` 指的 `binaries/dshwar-gateway-<triple>`。少一个就编译失败:
      #
      #     resource path `binaries/dshwar-gateway-x86_64-…` doesn't exist
      #
      # ⚠️ 这条在开发机上**永远不出现** —— 那里两样都是上一次打包留下的。
      # 本 job 第一次真跑就在这里红,而且**两个平台一模一样地红**。
      # (先想到的解释是「keychain 在无头环境里不可用」—— 顺理成章,但错了:
      #  测试根本没跑到,编译就停了。两个平台同样地红本该是第一个线索。)
      - name: 打包前置(前端产物 + sidecar)
        run: |
          pnpm --filter @dshwar/workbench-web build
          node scripts/pack-sidecar.mjs

      # ★ 23 条 Rust 断言,其中一条**真的读写系统钥匙串**。
      #
      # ⚠️ 无头 Linux 上没有 Secret Service,那一条会红。正解是**起一个后端**,
      #    不是给它加 `#[ignore]` —— 藏起来之后就再也没人验过了
      #    (src-tauri/README.md 第五节写着这句话,这里是它的兑现)。
      # ⚠️ 这里直接调 `cargo test`,而**不是** `pnpm test:shell` —— 后者是
      #    check:all 里的一项,在 CI 里单列它就成了「第二份门禁清单」
      #    (check-guards 有一条守卫盯着这件事,它当场拦过一次)。
      #
      #    两者的关系:`test:shell` 是**本机**入口,而它在 CI 上**跳过并把这一步
      #    认作代跑方** —— 它读本文件,确认这里还在调 cargo test,读不到就红。
      #    所以这一步的名字可以改,命令不能删。
      #
      # 🚨 为什么 test:shell 必须在 CI 上跳过:`ubuntu-latest` **自带 Cargo**
      #    (实测 1.97.1)。上一版以为「CI 里没有 Rust」,于是门禁 job 里的
      #    test:shell 走了「真跑」那一档,`cargo test` 去编 Tauri 的 bin 目标,
      #    撞上门禁 job 没装的 WebKitGTK —— Node 22 / Node 24 两条一模一样地红。
      #    「workflow 里没写 cargo」不等于「机器上没有 cargo」。
      - name: Rust 断言(Linux:先起一个 keyring 后端)
        if: runner.os == 'Linux'
        run: |
          dbus-run-session -- bash -c '
            echo -n "ci-test-password" | gnome-keyring-daemon --unlock --components=secrets &
            sleep 2
            cargo test --manifest-path src-tauri/Cargo.toml
          '

      - name: Rust 断言(Windows:凭据管理器是系统自带的)
        if: runner.os == 'Windows'
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # tauri-cli 从源码装要几分钟 —— 上面的 rust-cache 会把它连同依赖一起缓存。
      - name: 装 tauri-cli
        run: cargo install tauri-cli --version "^2" --locked

      # ★ 真的打一次包:前端产物 → sidecar(Node 运行时 + 生产依赖树 + 原生模块)
      #   → cargo tauri build。三步任一失败都会让这个 job 红。
      #
      # ⚠️ 这一步顺带盯着「运行时依赖不许躺在 devDependencies 里」的**真实后果**:
      #   `pnpm deploy --prod` 装不上的包,在这里会变成 ERR_MODULE_NOT_FOUND。
      #   守卫(check-guards)是早一步的那道;这一步是它的兜底实证。
      - name: 打包
        shell: bash
        run: pnpm pack:desktop 2>&1 | tee "$RUNNER_TEMP/pack.log"

      # 与门禁那一步同款:失败的关键行喂进 annotation。
      # 打包这一步尤其需要 —— 它的失败几乎全是环境差异,而看日志要 admin 权限。
      - name: 失败时把打包的关键行喂进 annotation
        if: failure()
        shell: bash
        run: node scripts/ci-annotate.mjs "$RUNNER_TEMP/pack.log" "pack:desktop 失败"

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          # ⚠️ 这些包**没有签名**:Windows 上装会有 SmartScreen 警告。
          #    签名要外部资源(SignPath Foundation 需先有 release),不在本 Session。
          #
          # ⚠️ 没有 `*.AppImage` —— Linux 只出 deb。理由见 docs/PACKAGING.md 第六节
          #    (一句话:AppImage 不是分发路径,而它的打包步骤要联网下载并运行
          #    一个需要 FUSE 的 linuxdeploy;tauri.conf.json 是纯 JSON,写不了注释)。
          path: |
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.deb
          if-no-files-found: error
# ════════════════════════════════════════════════════════════════════════
# ⚠️ 本文件里的每个 job 都必须做**实质检查**,且在守卫里登记。
#
# 2026-08-17 删掉了 `terminal-contract`(终端能力契约,仅 Linux)——
# 它只 `echo` 一行就退出,在面板上**永远是绿勾**。三条理由:
#
# 1. 它指向一个**不存在的任务**:注释写「Session 7 (R8)」,而当前规划里
#    没有任何 PTY 契约测试的 Session 7 —— 那个编号来自 V0.1.0 时代的归档块。
# 2. 真去实现要装 `@deepseek-ai/dsh-subprocess-local`,而它在
#    `gateway/src/runtime.ts` 的 `DELIBERATELY_OMITTED` 里有明确理由
#    (node-pty 原生构建;上游 ProcessInspector 的 win32 直接抛错)。
# 3. 待办本来就记在别处:`docs/RELEASE-CHECKLIST.md` 的「补测 node-pty 在
#    两层嵌套下是否可用」。**CI 面板不是待办清单** —— 一个常驻的占位 job
#    与常驻的 skip 一样,都依赖「有人注意到它」,而那正是会失效的那一环。
#
# 「一个不检查的 job 比没有 job 更糟:它在面板上占一个绿勾。」
#
# 这条不变式现在由 `check-guards.mjs` 的「CI job 必须做实质检查且已登记」
# 守住,负向验证在 `verify-guards.mjs` 的 26a/26b/26c。
# ════════════════════════════════════════════════════════════════════════
