# profiles/team.yml —— 团队内多用户,**进程隔离**
#
# ⚠️ **V0.4.7 改档:从逻辑隔离改为进程隔离。这是被迫的,不是优化。**
#
# 本 profile 曾写着「刻意保持逻辑隔离,团队内部的用户互相信任,
# 为此付每人 63 MB 是不划算的」。那个判断建立在一个错误前提上:
# 以为逻辑档的问题只是「隔离强度不够,可能被恶意越界」。
#
# 实测(V0.4.6)不是那样:逻辑档下 **principal 到不了 agent 执行层**,
# 多用户的 agent 全都往 {root}/anonymous/anonymous/default/ 写,
# **同名文件互相覆盖,且没有任何报错**。同事之间文件被覆盖也是 bug ——
# 「互相信任」这条边界在这里不适用。
#
# 而这是当前上游 API 下的**架构限制**,不是待办:四条路全部走不通,
# 见 ARCHITECTURE.md §2.4 的对照表。所以多用户只剩进程隔离一档。
#
# 配套的 gateway.config.json 必须是:
#   { "isolation": { "level": "process", "maxProcesses": 64 } }
# 代价:每个活跃成员约 63 MB 常驻(Linux 实测)。50 人团队 ≈ 3.2 GB。
#
# ⚠️ 逻辑档 + 多于一个令牌会被网关**拒绝启动**(V0.4.7 配置层闸门)——
# 留一个自相矛盾的 profile 在仓库里,等于给第一个照它配置的人挖坑。
#
# 与 single-user.yml 的**唯一**差别:三个运行时契约换成 DSHWAR 的多用户实现,
# 外加 principal 与 auth。上游插件一个不动 —— 这正是「只加隔离、不改语义」
# 要证明的事(硬规则 8)。
#
# 上游版本:0.1.0-rc.6(精确锁版)

# 隔离级别不在本文件里 —— 本文件是插件清单(顶层是 YAML 序列),
# 隔离是网关的部署决策。与本 profile 配套的取值是 gateway.config.json 里的
# "isolation": { "level": "logical" },也就是默认值。见 docs/DEPLOYMENT.md §2.5。

# ---------------------------------------------------------------------------
# 基础设施(与 single-user.yml 相同)
# ---------------------------------------------------------------------------
- id: timer
  name: '@deepseek-ai/cordis-plugin-timer'

# ---------------------------------------------------------------------------
# 身份 —— single-user.yml 里只有 principal,这里多一个 auth
# ---------------------------------------------------------------------------
- id: principal
  name: '@dshwar/principal'

- id: auth
  name: '@dshwar/auth-static'
  # ⚠️ auth-static 的 token 是明文配置,**禁止部署**。
  # 它在这里是为了让 team.yml 能零外部依赖跑起来做对照测试。
  # 生产请换 @dshwar/auth-jwt 或 @dshwar/auth-oidc(V0.3.0)。
  config:
    entries:
      - token: dev-alice
        id: alice-e6f1
        tenantId: acme
        roles: [member]
      - token: dev-bob
        id: bob-a2b3
        tenantId: globex
        roles: [member]

# ---------------------------------------------------------------------------
# 运行时契约 —— 这三个是与 single-user.yml 的全部差异
#
#   credentials-local  → credentials-multiuser
#   fs-local           → fs-tenant（包装 fs-local，不替代）
#   storage            → storage-scoped（包装后端，不替代）
# ---------------------------------------------------------------------------
- id: credentials
  name: '@dshwar/credentials-multiuser'

- id: fs
  name: '@dshwar/fs-tenant'
  config:
    # 每个主体的实际根是 {root}/{tenantId}/{userId}/{workspaceId}(V0.4.1 起四段)。
    # 未指定 workspaceId 时落到 default —— 本 profile 不配 workspaceOf,
    # 因此全部操作都在 default 工作区里,行为与 V0.4.1 之前完全一致。
    #
    # 网关部署要按会话切工作区,见 profiles/gateway.yml 与
    # docs/DECISIONS/workspace-in-api.md。
    root: !!js dshHomePath('workspaces')

- id: storage
  name: '@dshwar/storage-scoped'

# ---------------------------------------------------------------------------
# 以下全部与 single-user.yml 逐行相同 —— 差异只在上面那三个
# ---------------------------------------------------------------------------
- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

- id: session
  name: '@deepseek-ai/dsh-session'

- id: session-persistence-jsonl
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')

- id: llm
  name: '@deepseek-ai/dsh-llm'

- id: agent
  name: '@deepseek-ai/dsh-agent'
# ⚠️ 刻意**不含** session-query-sqlite:它是全局索引、不感知 principal,
# 查询会跨租户。见 docs/DECISIONS/storage-scoping.md。
