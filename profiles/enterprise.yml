# profiles/enterprise.yml —— OIDC + SCIM 的部署组合(V0.3.0)
#
# = gateway.yml,把 auth-static 换成 auth-oidc,并加上 SCIM 供给与身份镜像。
# 与 gateway.yml 的差异**只有身份部分** —— 运行时契约与 agent 插件逐行相同,
# 这与 team.yml ↔ single-user.yml 的对照是同一条纪律:换身份不改语义。
#
# ⚠️ 自 V0.4.5 起本 profile 切到**进程隔离**(一 principal 一进程)。
# 这是本仓唯一默认开进程隔离的 profile —— enterprise 的典型场景是跨部门、
# 跨供应商、外部顾问混跑,那已经越过信任边界了。
#
# 代价:每个活跃 principal 常驻 ~63 MB、首次请求多 ~86 ms 冷启动(Linux 实测)。
# maxProcesses 必须按机器内存设,见 docs/DEPLOYMENT.md §2.5。
#
# ⚠️ 进程隔离**不是容器**:不防内核提权、不限资源、不隔离网络。
# 面向公众的多租户 SaaS 请用 container 档(本版本仅配置位,实现交给编排系统)。
#
# 上游版本:0.1.0-rc.6(精确锁版)

# ---------------------------------------------------------------------------
# 隔离级别(V0.4.5)—— 不在本文件里
# ---------------------------------------------------------------------------
# 本文件是**插件清单**(dsh 自带 loader 的格式,顶层是一个 YAML 序列),
# 而隔离级别是网关自己的部署决策,不是一个 cordis 插件。它配在
# gateway.config.json 的 "isolation" 段里:
#
#   { "isolation": { "level": "process", "maxProcesses": 64,
#                    "idleTimeoutMs": 300000 } }
#
# 模板见 gateway/gateway.config.example.json,说明见 docs/DEPLOYMENT.md §2.5。
# 与本 profile 配套的取值是 level: process。

# ---------------------------------------------------------------------------
# 基础设施
# ---------------------------------------------------------------------------
- id: timer
  name: '@deepseek-ai/cordis-plugin-timer'

# ---------------------------------------------------------------------------
# 身份 —— 与 gateway.yml 的全部差异在这一段
# ---------------------------------------------------------------------------
- id: principal
  name: '@dshwar/principal'

- id: subject
  # 身份镜像。SCIM 写,auth 读 —— 停用在这里生效。
  name: '@dshwar/subject'

- id: auth
  name: '@dshwar/auth-oidc'
  config:
    # 只需要一个 issuer URL,jwks_uri 从 discovery 拿
    issuer: https://idp.example/realms/acme
    audience: dshwar
    # 必须与 SCIM 的 source 一致 —— auth 按 (source, sub) 查镜像
    source: idp
    tenantMap:
      strategy: issuer
      issuers:
        https://idp.example/realms/acme: acme
      # fallback 缺省即 reject(硬规则 7),不写出来就是拒绝

- id: scim
  name: '@dshwar/scim-server'
  config:
    source: idp
    # token 在网关配置里签发,按身份源一把;供给系统只能写身份镜像
    tenantMap:
      strategy: issuer
      issuers:
        idp: acme

- id: audit
  # 仅追加审计。所有 Admin 与 SCIM 调用都进这里(CLAUDE.md 第七节)。
  name: '@dshwar/audit'

- id: metering
  # 用量归属。观测不阻断 —— 它挂了会话照常,只是账目有缺口。
  # ⚠️ 价格表必须把用到的每个模型配全:查不到价计 0,是「没配价」不是「免费」。
  name: '@dshwar/metering'

- id: policy
  # 配额判定。只回答「能不能」,429 由网关发。
  # 计量不可用时 fail open 并落审计 —— 账目组件的故障不该升级成服务中断。
  name: '@dshwar/policy'

- id: model-router
  # 模型准入与预算降级。只在 createAgent 入口裁决,不碰请求路由。
  # 降级必须让用户看得见:响应头 + 会话记录 + 审计,三处留痕。
  name: '@dshwar/model-router'

- id: webhooks
  name: '@dshwar/webhooks'
  # 出站事件:subject.created / updated / deactivated。
  # 不做投递保证 —— 下游按最终一致设计,定期拉 /v1/admin/subjects 兜底。

# ---------------------------------------------------------------------------
# 运行时契约 —— 与 gateway.yml 逐行相同
# ---------------------------------------------------------------------------
- id: credentials
  name: '@dshwar/credentials-multiuser'

- id: fs
  name: '@dshwar/fs-tenant'
  config:
    # 四段路径 {root}/{tenantId}/{userId}/{workspaceId}。
    # ⚠️ 同一用户的不同工作区之间也做路径钉死,但**隔离级别与租户间相同** ——
    # 工作区分区解决的是「按项目分开干活」,不是信任问题。
    # 跨信任边界靠本 profile 的进程/容器隔离,不靠路径。
    root: !!js dshHomePath('workspaces')

- id: storage
  name: '@dshwar/storage-scoped'

- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

# ---------------------------------------------------------------------------
# 会话与 agent —— 与 gateway.yml 逐行相同
# ---------------------------------------------------------------------------
- id: session
  name: '@deepseek-ai/dsh-session'

- id: session-persistence-jsonl
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')

- id: llm
  name: '@deepseek-ai/dsh-llm'

- id: tools
  name: '@deepseek-ai/dsh-tools'

- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'

- id: agent
  name: '@deepseek-ai/dsh-agent'

- id: agent-loop
  name: '@deepseek-ai/dsh-agent-loop'
  config:
    agents: []
# ⚠️ 同样不含 session-query-sqlite(跨租户,见 docs/DECISIONS/storage-scoping.md)
