[package]
name = "dshwar-shell"
version = "0.9.0"
edition = "2021"
description = "DSHWAR 桌面壳。本 crate 只做宿主能力:系统钥匙串、跨源允许清单、sidecar 编排。"
license = "MIT"
publish = false

# V0.9.0 Session 5 时这里只有 lib —— 打包是单独两周,那时不做。
# Session 6 补上 bin:`tauri-build` 的 codegen 要前端产物与图标,两者现在都有了。
#
# **lib 仍然保留**,而且它才是被测的那一半:`cargo test` 跑的是 lib 里的
# 15 条断言(钥匙串真读写 + 允许清单逐维相等)。bin 只做装配 ——
# 装配逻辑越薄,「测不到的那部分」就越小。
[lib]
name = "dshwar_shell"
path = "src/lib.rs"

[[bin]]
name = "dshwar-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde_json = "1"
# 本机令牌要真随机 —— 网关绑在 127.0.0.1 上,本机任何进程都够得着那个端口,
# 令牌是唯一的门。std 不提供 RNG,而 getrandom 只是一层系统调用的包装
# (Windows 上是 BCryptGenRandom),不引入任何算法实现。
getrandom = "0.2"

# 系统钥匙串:Windows Credential Manager / macOS Keychain / Linux Secret Service。
# ⚠️ 选它而不是自己写,是因为「把密钥存到系统安全存储」这件事在三个平台上
#    是三套完全不同的 API,而自己写的那一份会在其中两个平台上没人测过。
#
# 🚨 **平台 feature 必须显式开,而且这不是可选的优化。**
#
# keyring 3 在**一个 store feature 都没开**时回落到一个 **mock 后端**:
#   set_password() → Ok(())        ← 报告成功
#   get_password() → NoEntry       ← 而东西不在那儿
#
# 那是一条标准的**假成功回执** —— 登录之后「记住我」显示成功,
# 下次启动却要重新登录,而没有任何错误。
#
# ⚠️ 本仓实测撞上过:`round_trip_through_the_real_keychain` 那条测试
#   第一次跑就红了(写了读不回来),而另外四条纯字符串断言全绿 ——
#   **结构上的绿证明不了行为**,那条真的碰钥匙串的测试是唯一的捕手。
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
# linux-native 用 kernel keyutils —— 它**不跨重启**,所以再加 secret-service。
# 两者的差别是真实的:keyutils 的条目在重启后消失,而 refresh token 要活过重启。
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[dev-dependencies]
